name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: studyloop
          POSTGRES_PASSWORD: studyloop
          POSTGRES_DB: studyloop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyloop -d studyloop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://studyloop:studyloop@localhost:5432/studyloop
      TEST_DATABASE_URL: postgres://studyloop:studyloop@localhost:5432/postgres
      E2E_DATABASE_URL: postgres://studyloop:studyloop@localhost:5432/studyloop_e2e
      # CI-only placeholders: e2e signs in through the test bypass, never GitHub.
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3100
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:hooks
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
