# Local development database. Production compose lives in its own file (see ticket #18).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: studyloop
      POSTGRES_PASSWORD: studyloop
      POSTGRES_DB: studyloop
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyloop -d studyloop"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
